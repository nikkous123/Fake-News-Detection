<text x="343" y="376" text-anchor="middle" font-size="15" font-weight="650" fill="#245570" stroke="#fff" stroke-width="6" paint-order="stroke">Read labeled articles</text><text x="620" y="371" text-anchor="middle" font-size="15" font-weight="650" fill="#245570" stroke="#fff" stroke-width="6" paint-order="stroke">Read articles</text><text x="620" y="394" text-anchor="middle" font-size="15" font-weight="650" fill="#245570" stroke="#fff" stroke-width="6" paint-order="stroke">Write scores</text><text x="900" y="376" text-anchor="middle" font-size="15" font-weight="650" fill="#245570" stroke="#fff" stroke-width="6" paint-order="stroke">Read batch articles</text>
