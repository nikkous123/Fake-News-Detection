<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660" role="img" aria-labelledby="title desc">
<title id="title">Fake News Detection system overview</title>
<desc id="desc">Labeled CSVs are imported into local MongoDB. The Tkinter desktop app reads and writes records. Training reads labeled articles, sentiment analysis reads articles and writes scores, and pretrained inference accepts a title or reads articles for batch classification.</desc>
