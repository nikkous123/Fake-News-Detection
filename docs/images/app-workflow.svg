<text x="48" y="70" fill="#153347" font-size="38" font-weight="750">Fake News Detection</text>
<text x="49" y="103" fill="#456276" font-size="22">System overview and data flow</text>
<g fill="none" stroke="#2b647f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
